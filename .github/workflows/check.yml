name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with openapi-spec-validator==0.7.2 python -c "import json; from openapi_spec_validator import validate; validate(json.load(open('openapi.json')))"
